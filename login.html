
<!DOCTYPE html>

            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Hyr në llogari</h1>

            <form action="#" method="post">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Shkruaj email-in" required>

                <label for="password">Fjalëkalimi:</label>
                <input type="password" id="password" name="password"
                       placeholder="Shkruaj fjalëkalimin" required>

                <label for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Më mbaj mend
                </label>

                <button type="submit">Hyr</button>

            </form>

            <p>Nuk ke llogari? <a href="register.html">Regjistrohu</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ANDI Premium Cars. Të gjitha të drejtat e rezervuara.</p>
    </footer>

</body>
